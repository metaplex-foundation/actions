name: Verified build

inputs:
  library-name:
    description: Cargo library name to build (matches `[lib].name` in the program's Cargo.toml)
    required: true
  package:
    description: Cargo package name passed to `solana-verify build` after `--`. Required when the workspace has multiple members that could emit the same library filename
    required: false
  solana-version:
    description: |
      Solana version that produced the on-chain program. When `base-image` is
      not provided, the action resolves this against `solana-verify-base-images.json`
      at the actions repo root and uses the matching digest-pinned image.
      Pass `base-image` explicitly to override the lookup or to use a version
      that is not yet in the table
    required: false
  base-image:
    description: |
      Docker base image for the deterministic build. Must be digest-pinned
      (e.g. `solanafoundation/solana-verifiable-build@sha256:<digest>`) so a
      mutable upstream tag cannot change the resulting `.so` hash between
      runs. Takes precedence over `solana-version`. Leave both empty to use
      `solana-verify`'s default image. Set `allow-mutable-tag: true` to bypass
      the format check (not recommended)
    required: false
  allow-mutable-tag:
    description: |
      Allow `base-image` to use a mutable tag (e.g. `:1.18.26`) instead of a
      digest pin. Defaults to `false`. Mutable tags can be re-pushed by the
      registry owner, so two builds at the same git commit may produce
      different binaries. Only set this to `true` if you accept that risk
    required: true
    default: "false"
  working-directory:
    description: Directory to run `solana-verify build` from
    required: true
    default: "."
  output-dir:
    description: Directory (relative to `working-directory`) to copy the built `.so` into. Leave empty to keep the artifact in `target/deploy` only
    required: false
  extra-args:
    description: Additional arguments forwarded verbatim to the inner `cargo build-sbf` invocation (after `--`)
    required: false

outputs:
  binary-path:
    description: Path to the produced `.so` relative to `working-directory`
    value: ${{ steps.build.outputs.binary-path }}

runs:
  using: "composite"
  steps:
    - name: Run solana-verify build
      id: build
      working-directory: ${{ inputs.working-directory }}
      env:
        LIBRARY_NAME: ${{ inputs.library-name }}
        PACKAGE_NAME: ${{ inputs.package }}
        SOLANA_VERSION: ${{ inputs.solana-version }}
        BASE_IMAGE: ${{ inputs.base-image }}
        ALLOW_MUTABLE_TAG: ${{ inputs.allow-mutable-tag }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        # Resolve base-image: explicit input wins, otherwise look up by
        # solana-version against the table at the actions repo root.
        if [ -z "${BASE_IMAGE}" ] && [ -n "${SOLANA_VERSION}" ]; then
          LOOKUP_FILE="${ACTION_PATH%/}/../solana-verify-base-images.json"
          if [ ! -f "${LOOKUP_FILE}" ]; then
            echo "::error::solana-version lookup table not found at ${LOOKUP_FILE}"
            exit 1
          fi
          BASE_IMAGE=$(jq -r --arg v "${SOLANA_VERSION}" '.images[$v] // empty' "${LOOKUP_FILE}")
          if [ -z "${BASE_IMAGE}" ]; then
            KNOWN=$(jq -r '.images | keys | join(", ")' "${LOOKUP_FILE}")
            echo "::error::no known digest for solana-version '${SOLANA_VERSION}'. Pass 'base-image' explicitly or add an entry to solana-verify-base-images.json. Known versions: ${KNOWN}"
            exit 1
          fi
        fi

        # Reject mutable Docker tags by default. A PR-controlled tag (or a
        # re-pushed upstream tag) can swap the verified-build image and
        # silently change the .so hash. Digest-pinning via `@sha256:<64 hex>`
        # ties the build to one specific image manifest.
        if [ -n "${BASE_IMAGE}" ] && [[ ! "${BASE_IMAGE}" =~ ^[^@[:space:]]+@sha256:[a-f0-9]{64}$ ]]; then
          if [ "${ALLOW_MUTABLE_TAG}" = "true" ]; then
            echo "::warning::base-image '${BASE_IMAGE}' is not digest-pinned (allow-mutable-tag=true). Builds may not be reproducible."
          else
            echo "::error::base-image '${BASE_IMAGE}' must be digest-pinned (e.g. <image>@sha256:<digest>). Pass allow-mutable-tag: true to bypass."
            exit 1
          fi
        fi

        ARGS=(solana-verify build)
        if [ -n "${BASE_IMAGE}" ]; then
          ARGS+=(--base-image "${BASE_IMAGE}")
        fi
        ARGS+=(--library-name "${LIBRARY_NAME}")
        ARGS+=(--)
        if [ -n "${PACKAGE_NAME}" ]; then
          ARGS+=(--package "${PACKAGE_NAME}")
        fi
        if [ -n "${EXTRA_ARGS}" ]; then
          # shellcheck disable=SC2206
          EXTRA=(${EXTRA_ARGS})
          ARGS+=("${EXTRA[@]}")
        fi

        echo "+ ${ARGS[*]}"
        "${ARGS[@]}"

        SOURCE="target/deploy/${LIBRARY_NAME}.so"
        if [ ! -f "${SOURCE}" ]; then
          echo "::error::expected build output ${SOURCE} not found"
          exit 1
        fi

        BINARY_PATH="${SOURCE}"
        if [ -n "${OUTPUT_DIR}" ]; then
          mkdir -p "${OUTPUT_DIR}"
          DEST="${OUTPUT_DIR%/}/${LIBRARY_NAME}.so"
          cp "${SOURCE}" "${DEST}"
          BINARY_PATH="${DEST}"
        fi

        printf 'binary-path=%s\n' "${BINARY_PATH}" >> "${GITHUB_OUTPUT}"
      shell: bash
