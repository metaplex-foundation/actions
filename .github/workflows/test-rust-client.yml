name: Test Rust client

# Reusable workflow. cargo clippy on each Rust client crate, then the
# caller's `configs/scripts/client/test-rust.sh` against the program builds
# artifact. Clippy and the tests share one dependency build. Uses
# RUST_CLIENT_RUST_VERSION / RUST_CLIENT_SOLANA_VERSION when the client
# targets a newer toolchain than the program.

on:
  workflow_call:
    inputs:
      git_ref:
        description: Commit, branch or tag; defaults to the triggering commit
        type: string
        required: false
        default: ""
      runner:
        description: Runner label
        type: string
        required: false
        default: ubuntu-latest
      client_dir:
        description: The client crate, or `clients` for several (its Cargo workspace is what gets cached)
        type: string
        required: false
        default: clients/rust
      client_matrix:
        description: JSON array of Rust client crate directories to run clippy on
        type: string
        required: false
        default: '["clients/rust"]'
      features:
        description: Cargo feature flags for clippy, e.g. --all-features (default is the default feature set)
        type: string
        required: false
        default: ""
      clippy:
        description: Run cargo clippy on each crate in client_matrix before the tests
        type: boolean
        required: false
        default: true
      apt_packages:
        description: Extra apt packages (space separated), e.g. protobuf-compiler
        type: string
        required: false
        default: ""
      sbf_tools_version:
        description: When set, install solana-cargo-build-sbf and solana-cargo-test-sbf at this crate version (e.g. 4.0.0)
        type: string
        required: false
        default: ""
      cache:
        description: Use dependency caches
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_ref || github.sha }}
          persist-credentials: false

      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit of this reusable workflow file, so every composite
          # action below resolves from the same pinned commit the caller chose.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .mpl-actions
          persist-credentials: false

      - name: Load environment variables
        uses: ./.mpl-actions/load-env

      - name: Resolve toolchain
        id: toolchain
        shell: bash
        run: |
          echo "rust=${RUST_CLIENT_RUST_VERSION:-$RUST_VERSION}" >> "$GITHUB_OUTPUT"
          echo "solana=${RUST_CLIENT_SOLANA_VERSION:-$SOLANA_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install apt packages
        if: inputs.apt_packages != ''
        shell: bash
        env:
          PACKAGES: ${{ inputs.apt_packages }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y $PACKAGES

      - name: Install Rust
        uses: ./.mpl-actions/install-rust
        with:
          toolchain: ${{ steps.toolchain.outputs.rust }}

      - name: Install Solana
        uses: ./.mpl-actions/install-solana
        with:
          version: ${{ steps.toolchain.outputs.solana }}
          cache: ${{ inputs.cache }}

      - name: Install SBF test tools
        if: inputs.sbf_tools_version != ''
        uses: ./.mpl-actions/install-sbf-tools
        with:
          version: ${{ inputs.sbf_tools_version }}
          cache: ${{ inputs.cache }}

      - name: Cache client dependencies
        if: inputs.cache
        uses: ./.mpl-actions/cache-crate
        with:
          folder: ./${{ inputs.client_dir }}
          key: rust-client-test

      - name: Sanitize ref
        id: ref
        uses: ./.mpl-actions/sanitize-ref
        with:
          ref: ${{ inputs.git_ref }}

      - name: Download program builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.ref.outputs.artifact }}

      - name: Run cargo clippy
        if: inputs.clippy
        shell: bash
        env:
          CLIENTS: ${{ inputs.client_matrix }}
          FEATURES: ${{ inputs.features }}
        run: |
          set -euo pipefail
          # Fail on malformed or empty input rather than silently running no
          # clippy at all (a process substitution's failure would not stop the
          # loop).
          if ! list="$(jq -er 'if type == "array" and length > 0 and all(type == "string" and length > 0) then .[] else error("not a non-empty array of directories") end' <<< "$CLIENTS")"; then
            echo "::error::client_matrix must be a non-empty JSON array of crate directories, got: $CLIENTS"
            exit 1
          fi
          mapfile -t clients <<< "$list"
          for client in "${clients[@]}"; do
            test -f "$client/Cargo.toml" || { echo "::error::client_matrix entry '$client' has no Cargo.toml"; exit 1; }
            echo "::group::clippy ${client}"
            # shellcheck disable=SC2086
            (cd "$client" && cargo clippy --all-targets --no-deps $FEATURES)
            echo "::endgroup::"
          done

      - name: Run tests
        shell: bash
        working-directory: configs/scripts/client
        run: RUST_LOG=error ./test-rust.sh
