name: Publish JS client

# Reusable workflow: the publish half of a JS client release. The caller's
# workflow_dispatch workflow builds and tests first, then calls this with the
# release inputs. Publishes to npm with provenance, then opens a release pull
# request carrying the version bump; merging that PR triggers the caller's
# release-js-client workflow which tags and creates the GitHub release.

on:
  workflow_call:
    inputs:
      git_ref:
        description: Commit, branch or tag to publish from; defaults to the triggering ref
        type: string
        required: false
        default: ""
      bump:
        description: Version bump (patch, minor, major, prerelease, prepatch, preminor, premajor)
        type: string
        required: true
      tag:
        description: npm dist-tag (and preid for pre-releases)
        type: string
        required: false
        default: latest
      create_release:
        description: Open the release pull request and deploy docs
        type: boolean
        required: false
        default: true
      client_dir:
        description: Path to the JS client package
        type: string
        required: false
        default: clients/js
      base_branch:
        description: Base branch for the release pull request
        type: string
        required: false
        default: main
      deploy_docs:
        description: Deploy the client docs to Vercel after publishing (needs VERCEL_* secrets)
        type: boolean
        required: false
        default: false
      cache:
        description: Use dependency caches
        type: boolean
        required: false
        default: true
    secrets:
      VERCEL_TOKEN:
        required: false
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
    outputs:
      version:
        description: The published version
        value: ${{ jobs.publish.outputs.version }}

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm provenance (OIDC trusted publishing).
      id-token: write
    outputs:
      version: ${{ steps.bump.outputs.new_version }}
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit, not the branch: the build and test jobs before this
          # one checked out github.sha, and the branch may have moved since.
          ref: ${{ inputs.git_ref || github.sha }}
          persist-credentials: false

      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit of this reusable workflow file, so every composite
          # action below resolves from the same pinned commit the caller chose.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .mpl-actions
          persist-credentials: false

      - name: Load environment variables
        uses: ./.mpl-actions/load-env

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install client dependencies
        uses: ./.mpl-actions/install-node-dependencies
        with:
          folder: ./${{ inputs.client_dir }}
          cache: ${{ inputs.cache }}
          key: clients-js

      - name: Build
        working-directory: ./${{ inputs.client_dir }}
        run: pnpm build

      - name: Check release inputs
        env:
          BUMP: ${{ inputs.bump }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # A pre-release published under `latest` would become what a plain
          # `npm install` picks up.
          if [[ "$BUMP" == pre* ]] && [ "$TAG" = "latest" ]; then
            echo "::error::a $BUMP bump needs a dist-tag other than 'latest' (for example 'next' or 'beta')"
            exit 1
          fi

      - name: Bump version
        id: bump
        working-directory: ./${{ inputs.client_dir }}
        env:
          BUMP: ${{ inputs.bump }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$BUMP" in
            pre*) pnpm version "$BUMP" --preid "$TAG" --no-git-tag-version ;;
            *) pnpm version "$BUMP" --no-git-tag-version ;;
          esac
          echo "new_version=$(pnpm pkg get version | tr -d '"')" >> "$GITHUB_OUTPUT"

      # The package is built and bumped with the repository's NODE_VERSION
      # above; only the publish itself runs on the Node.js that npm trusted
      # publishing requires (22.14 or newer, with npm 11.5.1 or newer).
      - name: Install Node.js for publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        # Pinned because this job holds id-token: write.
        run: npm install -g npm@11.21.1

      - name: Publish
        working-directory: ./${{ inputs.client_dir }}
        env:
          TAG: ${{ inputs.tag }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          NAME="$(npm pkg get name | tr -d '"')"
          VERSION="$(npm pkg get version | tr -d '"')"
          # A rerun after a run that published the package but failed to
          # open the release pull request: npm would refuse the version, so
          # skip the publish and let the pull request be created. Only when
          # the registry holds this very tarball, though: the same version
          # computed from another commit must not get a release PR for code
          # that was never published.
          if PUBLISHED="$(npm view "${NAME}@${VERSION}" dist.integrity 2>/dev/null)" && [ -n "$PUBLISHED" ]; then
            LOCAL="$(npm pack --dry-run --json 2>/dev/null | jq -r '.[0].integrity')"
            if [ "$PUBLISHED" = "$LOCAL" ]; then
              # Skipping the publish also skips moving the dist-tag, which
              # trusted publishing cannot do; refuse rather than leave the
              # requested tag on another version.
              CURRENT="$(npm view "$NAME" "dist-tags.${TAG}" 2>/dev/null || true)"
              if [ "$CURRENT" != "$VERSION" ]; then
                echo "::error::${NAME}@${VERSION} is already on npm, but dist-tag '${TAG}' points at '${CURRENT:-nothing}'; run: npm dist-tag add ${NAME}@${VERSION} ${TAG}, then rerun"
                exit 1
              fi
              echo "::notice::${NAME}@${VERSION} is already on npm with this content; only the release pull request is created"
              exit 0
            fi
            echo "::error::${NAME}@${VERSION} is already on npm with different content (registry ${PUBLISHED}, this build ${LOCAL}); bump from the published source or pick another version"
            exit 1
          fi
          # npm refuses provenance from a private source repository; trusted
          # publishing itself works there, without the attestation.
          PROVENANCE=(--provenance)
          if [ "$REPO_PRIVATE" = "true" ]; then PROVENANCE=(); fi
          npm publish --access public --tag "$TAG" "${PROVENANCE[@]}"

      - name: Clean up
        shell: bash
        # The release PR must carry only the version bump, not the shared
        # actions checkout.
        run: rm -rf .mpl-actions

      - name: Create release pull request
        if: inputs.create_release
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: 'chore: release JS client v${{ steps.bump.outputs.new_version }}'
          branch: release/js-client-v${{ steps.bump.outputs.new_version }}
          # Explicit base so the PR is created even when the checkout is a
          # detached HEAD (dispatch with git_ref set to a tag or commit).
          base: ${{ inputs.base_branch }}
          title: 'chore: release JS client v${{ steps.bump.outputs.new_version }}'
          body: |
            ## Summary
            - publish-js-client bumped the package to `${{ steps.bump.outputs.new_version }}` and published it to npm
            - merging this PR tags `js@v${{ steps.bump.outputs.new_version }}` and creates the GitHub release
          labels: release

  deploy_docs:
    name: Deploy docs
    if: inputs.create_release && inputs.deploy_docs
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
    environment:
      name: js-client-documentation
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit, not the branch: the build and test jobs before this
          # one checked out github.sha, and the branch may have moved since.
          ref: ${{ inputs.git_ref || github.sha }}
          persist-credentials: false

      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .mpl-actions
          persist-credentials: false

      - name: Load environment variables
        uses: ./.mpl-actions/load-env

      - name: Install Node.js
        uses: ./.mpl-actions/install-node-with-pnpm
        with:
          version: ${{ env.NODE_VERSION }}
          cache: ${{ inputs.cache }}

      - name: Install client dependencies
        uses: ./.mpl-actions/install-node-dependencies
        with:
          folder: ./${{ inputs.client_dir }}
          cache: ${{ inputs.cache }}
          key: clients-js

      - name: Deploy to Vercel
        id: deploy
        working-directory: ./${{ inputs.client_dir }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          # The client declares vercel as a dev dependency; fall back to npx
          # for repositories that do not.
          if pnpm exec vercel --version >/dev/null 2>&1; then
            VERCEL="pnpm exec vercel"
          else
            VERCEL="npx --yes vercel"
          fi
          url="$($VERCEL deploy --prod --token="$VERCEL_TOKEN")"
          echo "deployed to $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
