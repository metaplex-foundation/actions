name: Benchmark

# Reusable workflow. Runs the JS client's `pnpm bench` against the local
# validator and either stores the result on the gh-pages branch (push to the
# default branch) or posts a comparison comment on the pull request.

on:
  workflow_call:
    inputs:
      git_ref:
        description: Commit, branch or tag; defaults to the triggering commit
        type: string
        required: false
        default: ""
      mode:
        description: "`store` (persist to gh-pages, for pushes) or `summary` (comment on the PR)"
        type: string
        required: false
        default: store
      client_dir:
        description: Path to the JS client package
        type: string
        required: false
        default: clients/js
      cache:
        description: Use dependency caches
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  benchmark:
    name: ${{ inputs.mode == 'summary' && 'Performance regression summary' || 'Performance regression check' }}
    runs-on: ubuntu-latest
    permissions:
      # gh-pages branch updates (store) and PR comments (summary).
      contents: write
      deployments: write
      pull-requests: write
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_ref || github.sha }}
          persist-credentials: false

      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit of this reusable workflow file, so every composite
          # action below resolves from the same pinned commit the caller chose.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .mpl-actions
          persist-credentials: false

      - name: Load environment variables
        uses: ./.mpl-actions/load-env

      - name: Sanitize ref
        id: ref
        uses: ./.mpl-actions/sanitize-ref
        with:
          ref: ${{ inputs.git_ref }}

      - name: Download program builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.ref.outputs.artifact }}

      - name: Install Solana
        uses: ./.mpl-actions/install-solana
        with:
          version: ${{ env.SOLANA_VERSION }}
          cache: ${{ inputs.cache }}

      - name: Install Node.js
        uses: ./.mpl-actions/install-node-with-pnpm
        with:
          version: ${{ env.NODE_VERSION }}
          cache: ${{ inputs.cache }}
          dependencies: true

      - name: Start validator
        run: pnpm validator

      - name: Install client dependencies
        uses: ./.mpl-actions/install-node-dependencies
        with:
          folder: ./${{ inputs.client_dir }}
          cache: ${{ inputs.cache }}
          key: clients-js

      - name: Build
        working-directory: ./${{ inputs.client_dir }}
        run: pnpm build

      - name: Benchmark
        working-directory: ./${{ inputs.client_dir }}
        run: pnpm bench

      - name: Check for the benchmark data branch
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # github-action-benchmark keeps its history on gh-pages and fails when
          # that branch does not exist yet (fresh repos, anything made from the
          # template). Give it a local empty branch instead: `store` pushes it
          # and so creates the remote branch; `summary` reports without a baseline.
          if out=$(gh api "repos/${GITHUB_REPOSITORY}/branches/gh-pages" --silent 2>&1); then
            echo "skip_fetch=false" >> "$GITHUB_OUTPUT"
          elif ! grep -q "HTTP 404" <<< "$out"; then
            # Only a confirmed 404 means "no branch"; anything else would make
            # `summary` skip the baseline and `store` push unrelated history.
            echo "::error::could not check for the gh-pages branch: $out"
            exit 1
          else
            echo "::notice::No gh-pages branch yet; benchmark history starts with this run"
            tree=$(git mktree </dev/null)
            commit=$(git -c user.name=github-actions -c user.email=github-actions@github.com \
              commit-tree "$tree" -m "Initialize benchmark data branch")
            git branch gh-pages "$commit"
            echo "skip_fetch=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Store benchmark result
        if: inputs.mode != 'summary'
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          tool: customSmallerIsBetter
          output-file-path: ./${{ inputs.client_dir }}/output.json
          fail-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          skip-fetch-gh-pages: ${{ steps.pages.outputs.skip_fetch == 'true' }}

      - name: Summarize benchmark result
        if: inputs.mode == 'summary'
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          tool: customSmallerIsBetter
          output-file-path: ./${{ inputs.client_dir }}/output.json
          summary-always: true
          # The token is read-only on PRs from forks; the job summary is the
          # fallback there.
          comment-always: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          save-data-file: false
          fail-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-fetch-gh-pages: ${{ steps.pages.outputs.skip_fetch == 'true' }}
