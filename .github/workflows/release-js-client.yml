name: Release JS client

# Reusable workflow. Called when a `release/js-client-v*` pull request is
# merged: reads the version from package.json on the merge commit, pushes the
# `js@v<version>` tag and creates the GitHub release.

on:
  workflow_call:
    inputs:
      client_dir:
        description: Path to the JS client package
        type: string
        required: false
        default: clients/js
      merge_commit_sha:
        description: The merge commit to tag; defaults to the triggering commit
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.merge_commit_sha || github.sha }}
          # This job pushes the tag below.
          persist-credentials: true

      - name: Read package version
        id: pkg
        working-directory: ./${{ inputs.client_dir }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$'; then
            echo "::error::invalid version '$VERSION' in package.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          git tag "js@v${VERSION}"
          git push origin "js@v${VERSION}"

      - name: Create GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: js@v${{ steps.pkg.outputs.version }}
          name: JS client v${{ steps.pkg.outputs.version }}
          generateReleaseNotes: true
