version: 2
updates:
  - package-ecosystem: github-actions
    # The composite actions live in top-level directories, not only under
    # .github/workflows.
    directories: ["/", "/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /upload-idl
    schedule:
      interval: weekly
    groups:
      upload-idl:
        patterns: ["*"]
    ignore:
      # The Solana Explorer parses Codama 1.x root nodes.
      - dependency-name: codama
        update-types: ["version-update:semver-major"]
      - dependency-name: "@codama/*"
        update-types: ["version-update:semver-major"]
