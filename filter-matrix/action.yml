name: Filter matrix

inputs:
  matrix:
    description: A JSON array of names
    required: true
  changes:
    description: A JSON array of changed filters from "dorny/paths-filter"
    required: true
  prefix:
    description: A prefix to prepend to the name when searching for filters
    required: true
    default: ""
  suffix:
    description: A suffix to append to the name when searching for filters
    required: true
    default: ""

outputs:
  matrix:
    description: A JSON array of name that have changed
    value: ${{ steps.filter.outputs.matrix }}

runs:
  using: "composite"
  steps:
    - name: Filter matrix
      id: filter
      shell: bash
      env:
        ORIGINAL: ${{ inputs.matrix }}
        CHANGES: ${{ inputs.changes }}
        PREFIX: ${{ inputs.prefix }}
        SUFFIX: ${{ inputs.suffix }}
      run: |
        set -euo pipefail
        echo "original matrix = $ORIGINAL"
        echo "changes = $CHANGES"
        # The filter names come from the caller's file-filters.yml, which a
        # pull request can change, so they only ever reach jq as data and
        # are never interpolated into this shell.
        FILTERED_MATRIX="$(jq -c --arg prefix "$PREFIX" --arg suffix "$SUFFIX" --argjson changes "${CHANGES:-[]}" '
          ($changes | map(gsub("-"; "_"))) as $changed
          | map(select((($prefix + . + $suffix) | gsub("-"; "_")) as $key | ($changed | index($key)) != null))
        ' <<< "$ORIGINAL")"
        echo "filtered matrix = $FILTERED_MATRIX"
        echo "matrix=$FILTERED_MATRIX" >> "$GITHUB_OUTPUT"
