name: Cache crate dependencies

description: |
  Cache the cargo registry and the build artifacts of the Cargo workspace
  that contains `folder`, via Swatinem/rust-cache.

  The workspace root and its target directory are resolved with cargo, so a
  crate that is a member of a root workspace (programs/<name> with the
  Cargo.lock and target/ at the repository root) is cached correctly, and a
  crate with its own lock file keeps its own cache. rust-cache keys on the
  lock files, manifests and toolchain, keeps the compiled dependencies and
  drops the workspace's own artifacts, so a cache stays small and is reused
  until a dependency changes.

inputs:
  folder:
    description: Path to the crate, or to any directory inside its Cargo workspace (without trailing slash)
    required: true
  key:
    description: A unique key for the cache, e.g. the program or client name (jobs with the same key share a cache)
    required: true
  cache-on-failure:
    description: Save the cache even when a later step fails (tests failing must not cost the dependency build)
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Resolve Cargo workspace
      id: workspace
      shell: bash
      env:
        FOLDER: ${{ inputs.folder }}
      run: |
        set -euo pipefail
        test -d "$FOLDER" || { echo "::error::'$FOLDER' is not a directory"; exit 1; }
        # Run cargo from the folder itself: it walks up to the workspace
        # manifest (so a directory such as `clients` that holds several member
        # crates resolves too) and discovers the same .cargo/config.toml the
        # build uses, including any build.target-dir override.
        META="$(cd "$FOLDER" && cargo metadata --no-deps --format-version 1)"
        ROOT="$(jq -r '.workspace_root' <<< "$META")"
        TARGET="$(jq -r '.target_directory' <<< "$META")"
        # rust-cache takes the target directory relative to the workspace root
        # and accepts an absolute root; no realpath needed (macOS has no
        # --relative-to).
        case "$TARGET" in
          "$ROOT"/*) REL_TARGET="${TARGET#"$ROOT"/}" ;;
          *) echo "::error::target directory '$TARGET' is outside the workspace '$ROOT'"; exit 1 ;;
        esac
        echo "workspace=${ROOT} -> ${REL_TARGET}" >> "$GITHUB_OUTPUT"
        SHOWN="${ROOT#"$GITHUB_WORKSPACE"}"
        echo "Caching workspace ${SHOWN:-.} (target ${REL_TARGET}) for '$FOLDER'"

    - name: Cache crate dependencies
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: ${{ steps.workspace.outputs.workspace }}
        # shared-key replaces rust-cache's job-id key, so jobs that pass the
        # same key share one cache, as documented above.
        shared-key: ${{ inputs.key }}
        cache-on-failure: ${{ inputs.cache-on-failure }}
