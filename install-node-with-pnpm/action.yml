name: Install Node.js with PNPM

inputs:
  version:
    description: The Node.js version to install
    required: true
    default: "18.x"
  dependencies:
    description: whether to install dependencies on the root folder
    required: true
    default: "false"
  cache:
    description: Whether installed dependencies should be cached
    required: true
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.version }}
        cache: "pnpm"

    # Inlined rather than calling install-node-dependencies by tag, so a
    # checkout of this repository at one commit resolves every step from
    # that same commit.
    - name: Cache Node.js dependencies
      if: inputs.dependencies == 'true' && inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ./node_modules/
        # Native modules are built per Node ABI and CPU, so a matrix of Node
        # versions or runners must not share one node_modules cache.
        key: ${{ runner.os }}-${{ runner.arch }}-node-${{ inputs.version }}-${{ hashFiles('pnpm-lock.yaml', 'package-lock.json', 'yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-node-${{ inputs.version }}-

    - name: Install Node.js dependencies
      if: inputs.dependencies == 'true'
      run: pnpm install --frozen-lockfile
      shell: bash
